<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fish 音色库</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <header>
      <h1>🐟 Fish 音色库</h1>
      <p id="status" class="muted">加载中…</p>
    </header>

    <div id="banners"></div>

    <section class="card">
      <h2>试听</h2>
      <textarea id="test-text" rows="2" placeholder="试听的文字（留空就用默认的一句话，可以带 [happy] 这类情绪标签）"></textarea>
      <audio id="player" controls hidden></audio>
      <p id="test-info" class="muted"></p>
      <div class="row">
        <button id="btn-test-current">试听当前在用的音色</button>
        <button id="btn-default">改回默认音色</button>
      </div>
    </section>

    <section>
      <div class="list-head">
        <h2>已保存的音色</h2>
        <span id="count" class="muted"></span>
      </div>
      <div id="list"></div>
    </section>

    <section class="card" id="form-card">
      <h2 id="form-title">添加音色</h2>
      <label>名称
        <input id="f-name" maxlength="24" placeholder="例如：小克（不能有空格，不能是纯数字）" autocomplete="off">
      </label>
      <label>音色 ID
        <input id="f-id" placeholder="音色 ID，或直接粘贴 Fish 音色页面地址" autocomplete="off" spellcheck="false">
      </label>
      <label>备注
        <input id="f-note" maxlength="60" placeholder="可选，例如：开朗少女音 / 低沉旁白" autocomplete="off">
      </label>
      <div class="row">
        <button id="btn-save" class="primary">保存</button>
        <button id="btn-test-form">试听这个 ID</button>
        <button id="btn-cancel" hidden>取消编辑</button>
      </div>
      <p class="muted small">名称相同会覆盖原来的音色；备注留空会清掉原来的备注。</p>
    </section>
  </main>
  <div id="toast" role="status"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
